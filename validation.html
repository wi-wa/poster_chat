<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Filter validation</title>
    <style>
      :root {
        color-scheme: light dark;

        /* Same palette as styles.css, plus one color per judge. */
        --page: #f9f9f7;
        --surface: #fcfcfb;
        --ink: #0b0b0b;
        --ink-2: #52514e;
        --muted: #898781;
        --baseline: #c3c2b7;
        --border: rgba(11, 11, 11, 0.1);
        --series: #2a78d6;
        --wash: rgba(42, 120, 214, 0.08);
        --alert: #c62d2d;
        /* Judges take the dataviz categorical slots in fixed order (blue,
           orange, aqua), validated all-pairs against both page colors. */
        --judge-0: #2a78d6;
        --judge-1: #eb6834;
        --judge-2: #1baf7a;
        --judge-other: var(--muted);
        --mark-0: rgba(42, 120, 214, 0.22);
        --mark-1: rgba(235, 104, 52, 0.22);
        --mark-2: rgba(27, 175, 122, 0.24);
        --mark-other: rgba(137, 135, 129, 0.28);

        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --page: #0d0d0d;
          --surface: #1a1a19;
          --ink: #ffffff;
          --ink-2: #c3c2b7;
          --muted: #898781;
          --baseline: #383835;
          --border: rgba(255, 255, 255, 0.1);
          --series: #3987e5;
          --wash: rgba(57, 135, 229, 0.14);
          --alert: #e05a5a;
          --judge-0: #3987e5;
          --judge-1: #d95926;
          --judge-2: #199e70;
          --mark-0: rgba(57, 135, 229, 0.34);
          --mark-1: rgba(217, 89, 38, 0.36);
          --mark-2: rgba(25, 158, 112, 0.36);
        }
      }

      * {
        box-sizing: border-box;
        scrollbar-color: var(--baseline) transparent;
        scrollbar-width: thin;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        background: var(--page);
        color: var(--ink);
      }

      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }

      .shell {
        height: 100%;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
      }

      .topbar {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 12px 18px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }

      .title-block {
        flex: 1 1 auto;
        min-width: 0;
      }

      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 10px;
      }

      .tab {
        padding: 5px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--page);
        font-size: 12.5px;
        font-weight: 600;
        color: var(--ink-2);
      }

      .tab:hover {
        background: var(--wash);
      }

      .tab[aria-selected="true"] {
        border-color: var(--series);
        background: var(--wash);
        color: var(--ink);
      }

      h1 {
        margin: 0;
        font-size: 17px;
        font-weight: 650;
      }

      .status {
        margin-top: 3px;
        font-size: 12.5px;
        line-height: 1.45;
        color: var(--ink-2);
      }

      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        margin-top: 6px;
        font-size: 12px;
        color: var(--ink-2);
      }

      .legend-item {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .stepper {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .icon-button {
        width: 30px;
        height: 30px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--page);
      }

      .icon-button:hover {
        background: var(--wash);
      }

      .position {
        min-width: 72px;
        text-align: center;
        font-size: 12.5px;
        font-variant-numeric: tabular-nums;
        color: var(--ink-2);
      }

      .workspace {
        min-height: 0;
        display: grid;
        grid-template-columns: 360px minmax(0, 1fr);
      }

      .list {
        min-height: 0;
        overflow: auto;
        padding: 8px;
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .item {
        display: grid;
        grid-template-columns: 28px minmax(0, 1fr) auto;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 7px 10px;
        text-align: left;
        border: 0;
        border-radius: 8px;
        background: none;
      }

      .item:hover,
      .item.is-active {
        background: var(--wash);
      }

      .item.is-active {
        box-shadow: inset 2px 0 0 var(--series);
      }

      .item-index {
        font-size: 11px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      .item-body {
        display: block;
        min-width: 0;
      }

      .item-snippet {
        display: block;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        font-size: 12.5px;
        line-height: 1.4;
        color: var(--ink-2);
      }

      .item.is-active .item-snippet {
        color: var(--ink);
      }

      .item-judges {
        display: block;
        margin-top: 2px;
        font-size: 11px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      .item-rating {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        margin-right: 10px;
      }

      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
      }

      .item-mean {
        font-size: 14px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: var(--ink-2);
      }

      .item-mean.is-above,
      .mean-badge.is-above {
        color: var(--alert);
      }

      .divider {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 6px 4px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--alert);
      }

      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--alert);
        opacity: 0.5;
      }

      .detail {
        min-height: 0;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
      }

      .meta {
        display: flex;
        align-items: flex-start;
        gap: 16px;
        padding: 14px 22px;
        border-bottom: 1px solid var(--border);
      }

      .meta-text {
        flex: 1;
        min-width: 0;
      }

      .meta-title {
        font-size: 14px;
        font-weight: 650;
      }

      .meta-sub {
        margin-top: 4px;
        font-size: 12px;
        line-height: 1.5;
        color: var(--ink-2);
        font-variant-numeric: tabular-nums;
      }

      .mean-block {
        text-align: right;
      }

      .mean-badge {
        font-size: 30px;
        font-weight: 700;
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
      }

      .mean-caption {
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .body {
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
      }

      .doc-text {
        position: relative;
        min-height: 0;
        margin: 0;
        padding: 18px 22px 24px;
        overflow: auto;
        white-space: pre-wrap;
        overflow-wrap: break-word;
        font-family: inherit;
        font-size: 14px;
        line-height: 1.65;
      }

      .judgements {
        min-height: 0;
        overflow: auto;
        padding: 16px 18px;
        border-left: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .judgement {
        display: grid;
        gap: 6px;
      }

      .judgement-head {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .swatch {
        flex: none;
        width: 10px;
        height: 10px;
        border-radius: 3px;
      }

      .judgement-model {
        flex: 1;
        min-width: 0;
        font-size: 12.5px;
        font-weight: 650;
      }

      .judgement-rating {
        font-size: 15px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }

      .judgement-explanation {
        font-size: 12.5px;
        line-height: 1.5;
        color: var(--ink-2);
        white-space: pre-wrap;
      }

      .judgement-quote {
        margin: 2px 0 0;
        padding: 2px 10px;
        border-left: 3px solid var(--series);
        font-size: 12.5px;
        line-height: 1.5;
        font-style: italic;
        color: var(--ink-2);
        white-space: pre-wrap;
      }

      .judgement-note {
        font-size: 11.5px;
        color: var(--muted);
      }

      /* The background is set per run, and clone repeats it on every line a
         quote wraps onto. */
      mark.hl {
        color: inherit;
        border-radius: 3px;
        -webkit-box-decoration-break: clone;
        box-decoration-break: clone;
      }

      @media (max-width: 900px) {
        .shell {
          height: auto;
          min-height: 100%;
        }

        .workspace,
        .body {
          grid-template-columns: minmax(0, 1fr);
        }

        .list {
          max-height: 40vh;
          border-right: 0;
          border-bottom: 1px solid var(--border);
        }

        .doc-text {
          overflow: visible;
        }

        .judgements {
          border-left: 0;
          border-top: 1px solid var(--border);
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="title-block">
          <nav id="tabs" class="tabs" role="tablist" aria-label="Filter"></nav>
          <h1 id="title">Filter validation</h1>
          <div id="status" class="status" role="status" aria-live="polite">Loading&hellip;</div>
          <div id="legend" class="legend" aria-label="Judges"></div>
        </div>
        <div class="stepper" aria-label="Document navigation">
          <button id="prev" class="icon-button" type="button" title="Previous document (&larr; or k)">&larr;</button>
          <output id="position" class="position">0 / 0</output>
          <button id="next" class="icon-button" type="button" title="Next document (&rarr; or j)">&rarr;</button>
        </div>
      </header>

      <section class="workspace">
        <nav id="list" class="list" aria-label="Documents sorted by mean judge rating, highest first"></nav>

        <article class="detail">
          <div class="meta">
            <div class="meta-text">
              <div id="metaTitle" class="meta-title">No document selected</div>
              <div id="metaSub" class="meta-sub"></div>
            </div>
            <div class="mean-block">
              <div id="mean" class="mean-badge">&ndash;</div>
              <div id="meanCaption" class="mean-caption">mean rating</div>
            </div>
          </div>
          <div class="body">
            <pre id="text" class="doc-text"></pre>
            <aside id="judgements" class="judgements" aria-label="Judge ratings"></aside>
          </div>
        </article>
      </section>
    </main>

    <script>
      "use strict";

      // One tab per filter. ?file=<path from the repo root> instead opens any
      // single ledger written by scripts/data/pretrain_filter_validation.py.
      const DEFAULT_TABS = [
        {
          id: "experience",
          label: "Experience descriptions",
          file: "data/validation/exp_muse_grok_128.json",
        },
      ];
      // This page lives at the site root.
      const REPO_ROOT_URL = "./";

      // Pure helpers

      function shortModel(name) {
        return name.slice(name.indexOf("/") + 1);
      }

      function formatRating(value) {
        return value === null ? "–" : value.toFixed(1);
      }

      function formatZ(value, digits) {
        return typeof value === "number" ? value.toFixed(digits).replace("-", "−") : "–";
      }

      // Lowercases and collapses whitespace runs to one space, recording for
      // every output code unit the index of the input code unit it came from,
      // so a match in the normalized text maps back to a span of the original.
      function normalizeWithMap(text) {
        let out = "";
        const map = [];
        let spaceAt = -1;
        for (let i = 0; i < text.length; i++) {
          const ch = text[i];
          if (/\s/.test(ch)) {
            if (spaceAt < 0 && out.length > 0) spaceAt = i;
            continue;
          }
          if (spaceAt >= 0) {
            out += " ";
            map.push(spaceAt);
            spaceAt = -1;
          }
          const lower = ch.toLowerCase();
          out += lower;
          for (let k = 0; k < lower.length; k++) map.push(i);
        }
        return { out, map };
      }

      // [start, end) of the quote in the text, ignoring case and whitespace
      // differences, or null when the judge's quote does not occur in it.
      function findQuoteRange(text, quote) {
        const needle = normalizeWithMap(quote).out;
        if (!needle) return null;
        const haystack = normalizeWithMap(text);
        const at = haystack.out.indexOf(needle);
        if (at < 0) return null;
        return [haystack.map[at], haystack.map[at + needle.length - 1] + 1];
      }

      // Highest mean judge rating first. Equal means put the document with the
      // highest single rating first, then the one closest to the split cutoff.
      // Documents missing a successful rating from any judge sort last.
      function prepareDocuments(state) {
        const threshold = state.manifest.config.decision_threshold;
        const documents = state.samples.map((sample) => {
          const complete = sample.attempts.every((attempt) => attempt.status === "succeeded");
          const ratings = sample.attempts.map((attempt) =>
            attempt.status === "succeeded" ? attempt.rating : null,
          );
          const mean = complete
            ? ratings.reduce((sum, rating) => sum + rating, 0) / ratings.length
            : null;
          return {
            sample,
            ratings,
            mean,
            max: complete ? Math.max(...ratings) : null,
            above: mean !== null && mean > threshold,
          };
        });
        const orLowest = (value) => (value === null ? -Infinity : value);
        documents.sort(
          (a, b) =>
            orLowest(b.mean) - orLowest(a.mean) ||
            orLowest(b.max) - orLowest(a.max) ||
            a.sample.rank - b.sample.rank,
        );
        return documents;
      }

      // Judges take the categorical slots in file order. Past the third they
      // share one neutral color instead of cycling hues.
      function judgeSlot(index) {
        return index < 3 ? String(index) : "other";
      }

      // One tint per quoting judge, stacked as equal horizontal bands.
      function bandBackground(judges) {
        if (judges.length === 1) return `var(--mark-${judgeSlot(judges[0])})`;
        const step = 100 / judges.length;
        const stops = judges.map(
          (judge, k) =>
            `var(--mark-${judgeSlot(judge)}) ${(k * step).toFixed(2)}% ${((k + 1) * step).toFixed(2)}%`,
        );
        return `linear-gradient(to bottom, ${stops.join(", ")})`;
      }

      // Page

      const els = {
        tabs: document.getElementById("tabs"),
        title: document.getElementById("title"),
        status: document.getElementById("status"),
        legend: document.getElementById("legend"),
        prev: document.getElementById("prev"),
        next: document.getElementById("next"),
        position: document.getElementById("position"),
        list: document.getElementById("list"),
        metaTitle: document.getElementById("metaTitle"),
        metaSub: document.getElementById("metaSub"),
        mean: document.getElementById("mean"),
        meanCaption: document.getElementById("meanCaption"),
        text: document.getElementById("text"),
        judgements: document.getElementById("judgements"),
      };

      const view = {
        tab: null,
        documents: [],
        items: [],
        index: 0,
        models: [],
        filter: "",
        threshold: 0,
      };

      const tabs = (() => {
        const file = new URLSearchParams(location.search).get("file");
        const specs = file ? [{ id: "file", label: file.split("/").pop(), file }] : DEFAULT_TABS;
        return specs.map((spec) => ({ ...spec, loading: null, error: "", index: 0 }));
      })();

      function element(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }

      // Splits the text at quote boundaries into plain runs and <mark> runs,
      // banded with the tint of every judge that quoted the run. Document text
      // is untrusted, so it only ever enters the page as text nodes.
      function appendHighlighted(container, text, ranges) {
        const cuts = new Set([0, text.length]);
        for (const range of ranges) {
          cuts.add(range.start);
          cuts.add(range.end);
        }
        const points = [...cuts].sort((a, b) => a - b);
        let first = null;
        for (let i = 0; i + 1 < points.length; i++) {
          const start = points[i];
          const end = points[i + 1];
          const piece = text.slice(start, end);
          const judges = [
            ...new Set(
              ranges
                .filter((range) => range.start <= start && range.end >= end)
                .map((range) => range.judge),
            ),
          ];
          if (judges.length === 0) {
            container.append(document.createTextNode(piece));
            continue;
          }
          const mark = element("mark", "hl", piece);
          mark.style.background = bandBackground([...judges].sort((a, b) => a - b));
          mark.title = `Quoted by ${judges.map((judge) => view.models[judge]).join(", ")}`;
          container.append(mark);
          first ??= mark;
        }
        return first;
      }

      function renderList() {
        view.items = view.documents.map((doc, position) => {
          const item = element("button", "item");
          item.type = "button";
          const judges = element("span", "item-judges");
          judges.append(
            ...view.models.map((model, j) => {
              const status = doc.sample.attempts[j].status;
              const rating = element("span", "item-rating", doc.ratings[j] === null ? "–" : String(doc.ratings[j]));
              const dot = element("span", "dot");
              dot.style.background = `var(--judge-${judgeSlot(j)})`;
              rating.prepend(dot);
              rating.title = status === "succeeded" ? model : `${model}: ${status}`;
              return rating;
            }),
          );
          const body = element("span", "item-body");
          body.append(
            element("span", "item-snippet", doc.sample.document.text.replace(/\s+/g, " ").trim().slice(0, 200)),
            judges,
          );
          item.append(
            element("span", "item-index", String(position + 1)),
            body,
            element("span", doc.above ? "item-mean is-above" : "item-mean", formatRating(doc.mean)),
          );
          item.addEventListener("click", () => select(position));
          return item;
        });
        const nodes = [...view.items];
        const firstBelow = view.documents.findIndex((doc) => !doc.above);
        if (firstBelow > 0) {
          nodes.splice(firstBelow, 0, element("div", "divider", `threshold ${view.threshold}`));
        }
        els.list.replaceChildren(...nodes);
      }

      function renderDetail(doc) {
        const { sample } = doc;
        const source = sample.document;
        els.metaTitle.textContent = `Document ${view.index + 1} of ${view.documents.length}`;
        const otherZvals = Object.entries(source.mean_zvals ?? {})
          .filter(([name]) => name !== view.filter)
          .map(([name, value]) => `${name} z ${formatZ(value, 2)}`);
        els.metaSub.textContent = [
          `boundary rank ${sample.rank}`,
          ...(sample.source_split ? [`from ${sample.source_split}`] : []),
          `${view.filter} z ${formatZ(sample.selection_score, 6)}`,
          ...otherZvals,
          `${source.token_count.toLocaleString()} tokens`,
          `source document ${source.source_document_index}`,
        ].join(" · ");
        els.mean.textContent = formatRating(doc.mean);
        els.mean.classList.toggle("is-above", doc.above);

        const ranges = [];
        const cards = sample.attempts.map((attempt, j) => {
          const card = element("section", "judgement");
          const head = element("div", "judgement-head");
          const swatch = element("span", "swatch");
          swatch.style.background = `var(--judge-${judgeSlot(j)})`;
          head.append(
            swatch,
            element("span", "judgement-model", attempt.model),
            element(
              "span",
              "judgement-rating",
              attempt.status === "succeeded" ? String(attempt.rating) : attempt.status,
            ),
          );
          card.append(head);
          if (attempt.explanation) card.append(element("div", "judgement-explanation", attempt.explanation));
          const choice = attempt.response?.choices?.[0];
          if (attempt.status !== "succeeded" && choice?.finish_reason) {
            const native = choice.native_finish_reason ? ` (${choice.native_finish_reason})` : "";
            card.append(element("div", "judgement-note", `finish reason: ${choice.finish_reason}${native}`));
          }
          if (attempt.error) card.append(element("div", "judgement-note", attempt.error));
          const quote = (attempt.quote ?? "").trim();
          if (quote) {
            const block = element("blockquote", "judgement-quote", quote);
            block.style.borderColor = `var(--judge-${judgeSlot(j)})`;
            card.append(block);
            const range = findQuoteRange(source.text, quote);
            if (range) ranges.push({ start: range[0], end: range[1], judge: j });
            else card.append(element("div", "judgement-note", "Quote not found in the document text."));
          } else if (attempt.status === "succeeded") {
            card.append(element("div", "judgement-note", "No quote given."));
          }
          return card;
        });
        els.judgements.replaceChildren(...cards);
        els.judgements.scrollTop = 0;

        els.text.replaceChildren();
        const first = appendHighlighted(els.text, source.text, ranges);
        els.text.scrollTop = first ? Math.max(0, first.offsetTop - els.text.clientHeight / 3) : 0;
      }

      function select(position) {
        if (view.documents.length === 0) return;
        view.index = Math.min(Math.max(position, 0), view.documents.length - 1);
        view.items.forEach((item, j) => item.classList.toggle("is-active", j === view.index));
        view.items[view.index].scrollIntoView({ block: "nearest" });
        els.position.textContent = `${view.index + 1} / ${view.documents.length}`;
        view.tab.index = view.index;
        history.replaceState(null, "", `#tab=${view.tab.id}&rank=${view.documents[view.index].sample.rank}`);
        renderDetail(view.documents[view.index]);
      }

      // Fetches and prepares a tab's ledger once; switching back reuses it.
      async function loadTab(tab) {
        tab.error = "";
        let state;
        try {
          const response = await fetch(REPO_ROOT_URL + tab.file);
          if (response.status === 404) throw new Error("file not found, so this filter has no results yet");
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          state = await response.json();
        } catch (error) {
          tab.error = `Could not load ${tab.file}: ${error.message}.`;
          return;
        }
        const config = state.manifest.config;
        tab.name = tab.file.split("/").pop().replace(/\.json$/, "");
        tab.filter = config.filter;
        tab.threshold = config.decision_threshold;
        tab.models = (state.samples[0]?.attempts ?? []).map((attempt) => shortModel(attempt.model));
        tab.documents = prepareDocuments(state);

        const above = tab.documents.filter((doc) => doc.above).length;
        const unrated = tab.documents.filter((doc) => doc.mean === null).length;
        // Judges added to a ledger afterwards took no part in fitting its threshold.
        const added = new Set((state.derived_from ?? []).map((entry) => entry.added_model));
        const fittedFor = (state.samples[0]?.attempts ?? [])
          .map((attempt) => attempt.model)
          .filter((name) => !added.has(name))
          .map(shortModel);
        let thresholdNote = "";
        if (config.decision_threshold_source?.fitted === false) {
          thresholdNote = " (threshold not fitted for this filter)";
        } else if (added.size > 0) {
          thresholdNote = ` (threshold fitted for ${fittedFor.join(" + ")} only)`;
        }
        // Every split retained by a filter shares that filter's cutoff.
        const cutoff = [].concat(state.manifest.split)[0].retained_score_maximum;
        tab.status = [
          `${tab.documents.length} kept documents in ${[].concat(config.split_name).join(" + ")} ` +
            `closest to the ${tab.filter} cutoff (z ≤ ${formatZ(cutoff, 1)})`,
          `${above} with mean rating > ${tab.threshold}${thresholdNote}`,
          ...(unrated > 0 ? [`${unrated} missing a rating from at least one judge, listed last`] : []),
          "sorted by mean rating, highest first",
        ].join(" · ");
      }

      function renderTabs() {
        els.tabs.replaceChildren(
          ...tabs.map((tab) => {
            const button = element("button", "tab", tab.label);
            button.type = "button";
            button.setAttribute("role", "tab");
            button.setAttribute("aria-selected", String(tab === view.tab));
            button.addEventListener("click", () => showTab(tab));
            return button;
          }),
        );
      }

      function clearPanels(message) {
        Object.assign(view, { documents: [], items: [], index: 0, models: [] });
        els.status.textContent = message;
        els.legend.replaceChildren();
        els.list.replaceChildren();
        els.text.replaceChildren();
        els.judgements.replaceChildren();
        els.metaTitle.textContent = "No document selected";
        els.metaSub.textContent = "";
        els.mean.textContent = "–";
        els.mean.classList.remove("is-above");
        els.position.textContent = "0 / 0";
      }

      // Shows a tab at its last selected document, or at the given rank.
      async function showTab(tab, rank) {
        view.tab = tab;
        renderTabs();
        document.title = `Validation · ${tab.label}`;
        els.title.textContent = `Filter validation · ${tab.label}`;
        clearPanels(`Loading ${tab.file}…`);
        tab.loading ??= loadTab(tab);
        await tab.loading;
        if (view.tab !== tab) return; // another tab was chosen while this one loaded
        if (tab.error) {
          tab.loading = null; // clicking the tab again retries, e.g. once the file exists
          clearPanels(tab.error);
          history.replaceState(null, "", `#tab=${tab.id}`);
          return;
        }
        Object.assign(view, {
          documents: tab.documents,
          models: tab.models,
          filter: tab.filter,
          threshold: tab.threshold,
        });
        els.title.textContent = `Filter validation · ${tab.name}`;
        els.status.textContent = tab.status;
        els.legend.replaceChildren(
          ...view.models.map((model, j) => {
            const item = element("span", "legend-item");
            const swatch = element("span", "swatch");
            swatch.style.background = `var(--judge-${judgeSlot(j)})`;
            item.append(swatch, element("span", "", model));
            return item;
          }),
        );
        els.meanCaption.textContent = `mean of ${view.models.length} judges`;
        renderList();
        const wanted = tab.documents.findIndex((doc) => doc.sample.rank === rank);
        select(wanted >= 0 ? wanted : tab.index);
      }

      function main() {
        const hash = new URLSearchParams(location.hash.slice(1));
        const tab = tabs.find((candidate) => candidate.id === hash.get("tab")) ?? tabs[0];
        showTab(tab, Number(hash.get("rank")));
      }

      els.prev.addEventListener("click", () => select(view.index - 1));
      els.next.addEventListener("click", () => select(view.index + 1));
      document.addEventListener("keydown", (event) => {
        if (event.altKey || event.ctrlKey || event.metaKey) return;
        if (event.key === "ArrowRight" || event.key === "j") {
          event.preventDefault();
          select(view.index + 1);
        } else if (event.key === "ArrowLeft" || event.key === "k") {
          event.preventDefault();
          select(view.index - 1);
        }
      });

      main();
    </script>
  </body>
</html>
